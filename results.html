<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Results — Game of Thrones Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0a0a0a;
      color: #e8d5a3;
      font-family: 'EB Garamond', serif;
      font-size: 18px;
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 48px 24px 32px;
      border-bottom: 1px solid #3d2e1a;
      background: linear-gradient(180deg, #1a0e00 0%, #0a0a0a 100%);
    }

    .sigil {
      font-size: 36px;
      letter-spacing: 8px;
      color: #c9a84c;
      margin-bottom: 12px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 4vw, 38px);
      font-weight: 900;
      color: #c9a84c;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    header p {
      font-style: italic;
      color: #a08060;
      margin-top: 8px;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Score card ── */
    .score-card {
      text-align: center;
      padding: 48px 32px;
      background: #110d06;
      border: 1px solid #3d2e1a;
      margin-bottom: 40px;
    }

    .score-label {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a08060;
      margin-bottom: 16px;
    }

    .score-number {
      font-family: 'Cinzel', serif;
      font-size: clamp(56px, 12vw, 96px);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }

    .score-number.perfect   { color: #c9a84c; }
    .score-number.great     { color: #7aad5a; }
    .score-number.average   { color: #c8a44a; }
    .score-number.poor      { color: #8b1a1a; }

    .score-verdict {
      font-family: 'Cinzel', serif;
      font-size: clamp(14px, 2.5vw, 20px);
      color: #e8d5a3;
      margin-bottom: 8px;
    }

    .score-meta {
      font-size: 14px;
      color: #6a5540;
      font-style: italic;
    }

    /* ── Divider ── */
    .divider {
      text-align: center;
      color: #3d2e1a;
      letter-spacing: 12px;
      margin: 32px 0;
      font-size: 20px;
    }

    /* ── Transcript ── */
    .section-heading {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c9a84c;
      border-bottom: 1px solid #3d2e1a;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .transcript-list {
      list-style: none;
    }

    .transcript-list li {
      padding: 14px 0;
      border-bottom: 1px solid #1a1510;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .transcript-list li:last-child {
      border-bottom: none;
    }

    .turn-role {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .turn-role.agent {
      background: #2a1f0a;
      color: #c9a84c;
      border: 1px solid #3d2e1a;
    }

    .turn-role.user {
      background: #0a1a2a;
      color: #7aadcc;
      border: 1px solid #1a3a4a;
    }

    .turn-text {
      color: #c8b48a;
      flex: 1;
    }

    /* ── No data state ── */
    .no-data {
      text-align: center;
      padding: 64px 24px;
      color: #4a3a28;
      font-style: italic;
    }

    .no-data p { margin-bottom: 16px; }

    /* ── Actions ── */
    .actions {
      text-align: center;
      margin-top: 48px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 40px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: transparent;
      color: #c9a84c;
      border: 2px solid #c9a84c;
    }

    .btn-primary:hover {
      background: #c9a84c;
      color: #0a0a0a;
    }

    .btn-secondary {
      background: transparent;
      color: #6a5540;
      border: 2px solid #3d2e1a;
    }

    .btn-secondary:hover {
      color: #e8d5a3;
      border-color: #6a5540;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid #1a1510;
      color: #4a3a28;
      font-size: 13px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="sigil">⚔ ✦ ⚔</div>
    <h1>Session Complete</h1>
    <p>Ashara Dayne has rendered her verdict</p>
  </header>

  <main id="main-content">
    <!-- Populated by JavaScript -->
  </main>

  <footer>
    "A mind needs books like a sword needs a whetstone." — Tyrion Lannister
  </footer>

  <script>
    const QUESTIONS = [
      { label: 'Q1 — Easy',     question: 'Who is this person?',                                                                         answer: 'Jaime Lannister' },
      { label: 'Q2 — Moderate', question: 'What is the name of this seat of power, and what is it made from?',                           answer: 'The Iron Throne, forged from the swords of Aegon the Conqueror\'s defeated enemies' },
      { label: 'Q3 — Intermediate', question: 'What house uses this animal as its sigil, and name three of the Stark children\'s direwolves?', answer: 'House Stark. Any three of: Ghost, Grey Wind, Lady, Nymeria, Summer, Shaggydog' },
      { label: 'Q4 — Hard',     question: 'Aegon the Conqueror had two sister-wives. Name both and the dragons they rode.',               answer: 'Visenya rode Vhagar, Rhaenys rode Meraxes' },
      { label: 'Q5 — Expert',   question: 'Name the sellsword company Daenerys faces at Yunkai and who leads them.',                     answer: 'The Second Sons, led by Mero of Braavos (the Titan\'s Bastard)' }
    ];

    function getVerdict(score, total) {
      const pct = score / total;
      if (pct === 1)   return { text: 'The realm bows before you. A true master of lore.', cls: 'perfect' };
      if (pct >= 0.8)  return { text: 'Well played. Even the Lannisters would be impressed.', cls: 'great' };
      if (pct >= 0.6)  return { text: 'A respectable showing. The Citadel would take note.', cls: 'average' };
      if (pct >= 0.4)  return { text: 'You have much to learn, but courage counts for something.', cls: 'average' };
      return { text: 'The ravens have witnessed worse… but not often.', cls: 'poor' };
    }

    function formatTime(isoString) {
      if (!isoString) return '—';
      return new Date(isoString).toLocaleString();
    }

    function renderNoData() {
      document.getElementById('main-content').innerHTML = `
        <div class="no-data">
          <p>No session data found.</p>
          <p>Complete a trivia challenge first, then return here.</p>
          <div class="actions">
            <a href="index.html" class="btn btn-primary">Begin the Challenge</a>
          </div>
        </div>
      `;
    }

    function render(session) {
      const score   = session.score   || 0;
      const total   = session.total   || 5;
      const verdict = getVerdict(score, total);
      const main    = document.getElementById('main-content');

      // Build transcript HTML
      let transcriptHTML = '';
      const turns = session.transcript || [];
      if (turns.length > 0) {
        const items = turns.map(t => `
          <li>
            <span class="turn-role ${t.role}">${t.role === 'agent' ? 'Ashara' : 'You'}</span>
            <span class="turn-text">${escapeHtml(t.text)}</span>
          </li>
        `).join('');
        transcriptHTML = `
          <div class="divider">⚜ ⚜ ⚜</div>
          <h2 class="section-heading">Conversation Transcript</h2>
          <ul class="transcript-list">${items}</ul>
        `;
      }

      main.innerHTML = `
        <div class="score-card">
          <div class="score-label">Final Score</div>
          <div class="score-number ${verdict.cls}">${score} / ${total}</div>
          <div class="score-verdict">${verdict.text}</div>
          <div class="score-meta">
            ${session.userName ? session.userName + ' &nbsp;·&nbsp; ' : ''}
            ${formatTime(session.sessionStart)}
          </div>
        </div>

        <div class="divider">⚜ ⚜ ⚜</div>

        <h2 class="section-heading">The Five Questions</h2>
        <ul class="transcript-list">
          ${QUESTIONS.map((q, i) => `
            <li>
              <span class="turn-role agent">${q.label}</span>
              <span class="turn-text">
                <strong>${q.question}</strong><br>
                <span style="color:#7a6a50;font-style:italic;">Correct answer: ${q.answer}</span>
              </span>
            </li>
          `).join('')}
        </ul>

        ${transcriptHTML}

        <div class="actions">
          <a href="index.html" class="btn btn-primary">Challenge Again</a>
          <button class="btn btn-secondary" onclick="clearAndReset()">Clear Session</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function clearAndReset() {
      localStorage.removeItem('got-trivia-session');
      window.location.href = 'index.html';
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    const raw = localStorage.getItem('got-trivia-session');
    if (!raw) {
      renderNoData();
    } else {
      try {
        render(JSON.parse(raw));
      } catch (e) {
        renderNoData();
      }
    }
  </script>

</body>
</html>
